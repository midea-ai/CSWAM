output_dir: ./runs/robotwin_cswam_14d/default

# RobotWin data and the model/checkpoint interface are both 14D.
robotwin_action_dim: 14
robotwin_proprio_dim: 14
model_action_dim: 14
model_proprio_dim: 14

# dataloading
batch_size: 4
num_workers: 4

# scheduler
lr_scheduler_type: cosine
learning_rate: 2.0e-4
num_epochs: 5
max_steps: null
log_every: 10
timing_enabled: false
timing_log_every: 10
timing_warmup_steps: 5
host_memory_trim_every: 0
save_every: 5000
eval_every: 2500
eval_num_inference_steps: 10
eval_num_samples: 32
eval_seed: 42

# training
gradient_accumulation_steps: 1
mixed_precision: bf16
seed: 42
max_grad_norm: 1.0
weight_decay: 1.0e-2
resume: null

